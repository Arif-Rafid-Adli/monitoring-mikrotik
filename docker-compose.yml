services:
  mariadb:
    image: mariadb:11
    container_name: mikrotik_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mikrotik_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mikrotik_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      MIKROTIK_HOST: ${MIKROTIK_HOST:?Set MIKROTIK_HOST in .env}
      MIKROTIK_API_PORT: ${MIKROTIK_API_PORT:-8728}
      MIKROTIK_USER: ${MIKROTIK_USER:?Set MIKROTIK_USER in .env}
      MIKROTIK_PASSWORD: ${MIKROTIK_PASSWORD:?Set MIKROTIK_PASSWORD in .env}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      LOG_INTERVAL_MS: ${LOG_INTERVAL_MS:-60000}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mikrotik_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mikrotik_frontend
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mikrotik_net

  bastion:
    build:
      context: .
      dockerfile: bastion/Dockerfile
    container_name: mikrotik_bastion
    restart: unless-stopped
    volumes:
      - ./bastion/authorized_keys:/bastion/authorized_keys:ro
      - bastion_ssh_host_keys:/etc/ssh
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      BASTION_ROOT_PASSWORD: ${BASTION_ROOT_PASSWORD:-}
    ports:
      - "${BASTION_BIND:-127.0.0.1}:2222:22"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - mikrotik_net

volumes:
  db_data:
  bastion_ssh_host_keys:

networks:
  mikrotik_net:
    driver: bridge
